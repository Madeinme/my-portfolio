<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">Portfolio</p>
    <h1>안녕하세요, <span class="gradient-text">저의 작업물</span>을 소개합니다</h1>
    <p class="subtitle">HTML, CSS, 바닐라 JavaScript로 만든 작은 웹 프로젝트 모음입니다.</p>
  </header>

  <main>
    <h2 class="section-title">Projects <span id="project-count" class="count"></span></h2>
    <!-- 프로젝트 카드는 main.js에서 그립니다 -->
    <section id="project-grid" class="project-grid" aria-label="프로젝트 목록"></section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> My Portfolio</p>
  </footer>

  <script src="main.js"></script>

</html>
